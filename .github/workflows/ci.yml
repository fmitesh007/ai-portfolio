name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Smoke test DocQuery
        run: |
          uvicorn docquery.app.main:app --port 8001 &
          sleep 5
          curl -fsS http://127.0.0.1:8001/health
